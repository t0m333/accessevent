name: Day4 Frontend Check
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check templates exist
        run: |
          test -f templates/base.html
          test -f templates/index.html
          test -f templates/events.html
          test -f templates/login.html
          test -f templates/register.html
          test -f templates/profile.html
      - name: Check static files exist
        run: |
          test -f static/css/style.css
          test -f static/js/main.js
      - name: Check media queries
        run: grep -q "@media" static/css/style.css
      - name: Check showNotification
        run: grep -q "showNotification" static/js/main.js
      - name: Check ARIA in templates
        run: grep -q "aria-label" templates/base.html
      - name: Syntax check app.py
        run: python -m py_compile app.py
      - name: Done
        run: echo "Day4 Frontend Check completed"
